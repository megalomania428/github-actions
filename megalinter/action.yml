---
name: MegaLinter
description: Run MegaLinter with shared default configs and per-repo overrides
branding:
  icon: check-circle
  color: purple
runs:
  using: composite
  steps:
    - name: Run MegaLinter
      shell: bash
      run: exec "${{ github.action_path }}/launch.sh"
      env:
        MEGALINTER_STEP_ENV: ${{ toJSON(env) }}
