---
# cspell:ignore freezegun golangci GOLANGCI GOTOOLCHAIN ignorefile mypy MYPY pulumi venvs
# cspell:ignore DEVSKIM ISORT pylint PYLINT pytest SHFMT
VALIDATE_ALL_CODEBASE: true
# unable to use 2 spaces indents
DISABLE_LINTERS:
  - PYTHON_BLACK
  - PYTHON_ISORT
# ENABLE_LINTERS:
#   - BASH_EXEC
#   - SPELL_CSPELL
#   - EDITORCONFIG_EDITORCONFIG_CHECKER
REPORT_OUTPUT_FOLDER: none
PARALLEL_PROCESS_NUMBER: 11
OUTPUT_FORMAT: text
EXCLUDED_DIRECTORIES:
  - ".git"
  - ".vscode"
BASH_SHFMT_ARGUMENTS: "-i 2"
REPOSITORY_CHECKOV_ARGUMENTS: >-
  --skip-check CKV2_GHA_1,CKV2_ANSIBLE_3,CKV_ANSIBLE_5,CKV_ANSIBLE_6
PRINT_ALL_FILES: true
EDITORCONFIG_EDITORCONFIG_CHECKER_CLI_EXECUTABLE:
  - /ec-custom.sh
EDITORCONFIG_EDITORCONFIG_CHECKER_PRE_COMMANDS:
  - command: |
      cat <<'EOF' > /ec-custom.sh
      #!/usr/bin/env bash
      editorconfig-checker "$@"
      rc=$?
      # check for multiple empty lines at EOF
      for file in "$@"; do
        tail_lines=$(tail -n 2 -- "$file" | grep -c '^$')
        if [ "$tail_lines" -gt 1 ]; then
          echo "File [$file] has multiple trailing lines"
          rc=1
        fi
      done
      exit $rc
      EOF
      chmod -v 755 /ec-custom.sh
    cwd: workspace
    continue_if_failed: true
REPOSITORY_TRIVY_ARGUMENTS:
  - "--no-progress"
  - "--config=.trivy-config.yaml"
  - "--ignorefile=.trivy-ignore.yaml"
REPOSITORY_DEVSKIM_ARGUMENTS:
  - "-f"
  - "text"
MULTI_STATUS: false
GITHUB_STATUS_REPORTER: false
GITHUB_COMMENT_REPORTER: false
GITLAB_COMMENT_REPORTER: false
ACTION_ACTIONLINT_CONFIG_FILE: ".actionlint.yaml"
REPOSITORY_KINGFISHER_ARGUMENTS: "--exclude .git"
ANSIBLE_ANSIBLE_LINT_ARGUMENTS: "-f pep8 --force-color"
ANSIBLE_ANSIBLE_LINT_CONFIG_FILE: ".ansible-lint.yml"
ANSIBLE_ANSIBLE_LINT_COMMAND_REMOVE_ARGUMENTS: "-v"
ANSIBLE_ANSIBLE_LINT_POST_COMMANDS:
  - command: "rm -rfv .ansible"
    cwd: workspace
    continue_if_failed: true
ANSIBLE_ANSIBLE_LINT_PRE_COMMANDS:
  - command: |
      which ansible ansible-lint
      source /venvs/ansible-lint/bin/activate
      VER="$(python3 -c 'import ansible; print(ansible.__version__)')"
      /venvs/ansible-lint/bin/pip install pytest PyYAML ansible-core==$VER jinja2 \
      freezegun 'pulumi>=3.0.0,<4.0.0' 'pulumi-vault>=7.0.0'
    cwd: root
PYTHON_PYLINT_PRE_COMMANDS:
  - command: |
      which ansible pylint
      source /venvs/ansible-lint/bin/activate
      VER="$(python3 -c 'import ansible; print(ansible.__version__)')"
      /venvs/pylint/bin/pip install pytest PyYAML ansible-core==$VER jinja2 freezegun \
      'pulumi>=3.0.0,<4.0.0' 'pulumi-vault>=7.0.0' requests
    cwd: root
PYTHON_PYRIGHT_PRE_COMMANDS:
  - command: |
      which ansible pyright
      source /venvs/ansible-lint/bin/activate
      VER="$(python3 -c 'import ansible; print(ansible.__version__)')"
      deactivate
      pip install pytest PyYAML ansible-core==$VER jinja2 freezegun \
      'pulumi>=3.0.0,<4.0.0' 'pulumi-vault>=7.0.0'
    cwd: root
PYTHON_MYPY_PRE_COMMANDS:
  - command: |
      which ansible mypy
      source /venvs/ansible-lint/bin/activate
      VER="$(python3 -c 'import ansible; print(ansible.__version__)')"
      /venvs/mypy/bin/pip install pytest PyYAML ansible-core==$VER jinja2 freezegun \
      'pulumi>=3.0.0,<4.0.0' 'pulumi-vault>=7.0.0'
    cwd: root
GO_GOLANGCI_LINT_CLI_EXECUTABLE:
  - /gl-ci-custom.sh
GO_GOLANGCI_LINT_PRE_COMMANDS:
  - command: |
      cat <<'EOF' > /gl-ci-custom.sh
      #!/usr/bin/env bash
      [[ $1 = "version" ]] && {
        golangci-lint "$@"
        exit $?
      }
      rc=0
      dir_list='golang'
      workspace="${PWD}"
      go env -w GOTOOLCHAIN=auto
      for d in ${dir_list}; do
        cd "${workspace}/${d}"
        go mod download
        golangci-lint "$@" || rc=1
      done
      exit $rc
      EOF
      chmod -v 755 /gl-ci-custom.sh
    cwd: workspace
    continue_if_failed: true
SPELL_CSPELL_PRE_COMMANDS:
  - command: "npm install --prefix /node-deps @cspell/dict-ru_ru
      @cspell/dict-software-terms"
    cwd: root
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
ACTION_ZIZMOR_CONFIG_FILE: ".zizmor.yaml"
