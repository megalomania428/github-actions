---
# Config template for the pi review container. The "settings", "models" and "mcp"
# sections become settings.json, models.json and mcp.json of the pi agent directory.
# The same section of .github/review-pi_dev.yaml in the reviewed repository replaces
# the "defaults" part of a section, which stays when the repository config misses the
# section or sets it to null. The "mandatory" part is merged recursively under the
# result in launch.sh, so it only adds the keys left unset there.
# Placeholders "env<NAME>" are replaced by the value of the "<NAME>" environment
# variable in launch.sh, and a value equal to "json<NAME>" is replaced by the value
# of "<NAME>" parsed as JSON, which keeps booleans and numbers typed.
# cspell:ignore githubcopilot
settings:
  defaults:
    packages:
      - npm:pi-mcp-adapter
    quietStartup: true
    enableAnalytics: false
    collapseChangelog: true
    enableInstallTelemetry: false
    lastChangelogVersion: "0.85.1"
    defaultProvider: omni
    defaultModel: envLLM_NAME
    defaultThinkingLevel: envLLM_LVL
    theme: dark
    hideThinkingBlock: false
    warnings:
      anthropicExtraUsage: false
  mandatory:
    # LLM requests are retried by retry.ts within its own budget of delays, so the
    # retries of pi itself are off to keep the attempts from multiplying.
    retry:
      enabled: false
      provider:
        maxRetries: 0
    llmRetries: envLLM_RETRIES
models:
  defaults:
    providers:
      omni:
        baseUrl: envLLM_URL
        api: envLLM_API
        apiKey: envLLM_KEY
        compat:
          supportsReasoningEffort: jsonLLM_EFF
        models:
          - id: envLLM_NAME
            reasoning: jsonLLM_RSN
            contextWindow: jsonLLM_CTX
            maxTokens: jsonLLM_MAX
            thinkingLevelMap:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
  mandatory: {}
mcp:
  defaults:
    mcpServers:
      # Servers with direct tools are warmed up before the review, so their tools are
      # available from the first request.
      wripy:
        url: envFETCH_MCP_URL
        headers:
          Authorization: Bearer envFETCH_MCP_KEY
        directTools: true
      snomcy:
        url: envSEARCH_MCP_URL
        headers:
          Authorization: Bearer envSEARCH_MCP_KEY
        directTools: true
      # The github server is connected only when the agent asks for it.
      github:
        url: https://api.githubcopilot.com/mcp
        headers:
          Authorization: Bearer envGITHUB_TOKEN
        directTools: false
        lifecycle: lazy
  mandatory: {}
